# Copy to  .github/workflows/process-transcripts.yml  in the DATA repo (inflekt-os-data).
# One-time setup:
#   Variables: CODE_REPO = <owner>/Inflekt-OS   (already set for the morning brief)
#   Secrets:   CLAUDE_CODE_OAUTH_TOKEN = output of `claude setup-token` (run in your own terminal, Claude Pro/Max login)
#
# What it does: any transcript dropped into  intake/  (by the app's Upload button, a recorder script,
# or a poller) is de-duplicated (3 partners recording one call = 1 meeting), turned into proposed
# tasks / lead updates / meeting note by Claude, and filed in data/inbox.json
# for approval in the app. Raw transcripts are deleted afterwards.
name: Process transcripts
on:
  push:
    paths: ['intake/**']
  workflow_dispatch: {}          # "Run workflow" = retry anything that failed
  schedule:
    - cron: '41 */3 * * *'       # safety net in case a push trigger is missed
permissions:
  contents: write
concurrency:
  group: process-transcripts
  cancel-in-progress: false
env:
  TZ: Asia/Kolkata
jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.CODE_REPO }}
          path: code
      - name: Find new transcripts, merge duplicates, build prompts
        id: prep
        run: python3 code/scripts/intake.py prepare . "$RUNNER_TEMP/work"
      - name: Extract with Claude
        if: steps.prep.outputs.queued != '0'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          npm install -g @anthropic-ai/claude-code >/dev/null 2>&1
          for p in "$RUNNER_TEMP"/work/*.prompt; do
            id=$(basename "$p" .prompt)
            echo "extracting $id"
            claude -p "Follow the instructions in the input exactly and reply in the requested format." --output-format text < "$p" > "$RUNNER_TEMP/work/$id.out" 2> "$RUNNER_TEMP/work/$id.err" || echo "claude failed for $id"
          done
      - name: File results for review
        if: always() && steps.prep.outcome == 'success'
        run: python3 code/scripts/intake.py finish . "$RUNNER_TEMP/work"
      - name: Commit
        if: always() && steps.prep.outcome == 'success'
        run: |
          git config user.name "inflekt-os-bot"
          git config user.email "inflekt-os-bot@users.noreply.github.com"
          git add -A data intake
          git diff --cached --quiet || (git commit -m "intake: transcripts processed" && git pull --rebase -q && git push)
