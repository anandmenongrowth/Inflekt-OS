<style>
:root{--bg:#f4f6f7;--card:#fff;--ink:#16191b;--mute:#5d6a72;--line:#dfe5e8;--pri:#1b7f88;--pri-ink:#fff;--brand:#2296a0;--ok:#1a7f4b;--warn:#d97c1d;--bad:#d9382a;--head:#0e0f11;--st-todo:#e5483a;--st-doing:#f2a10c;--st-done:#1f9d55}
@media(prefers-color-scheme:dark){:root{--bg:#0e0f11;--card:#17191c;--ink:#f1f4f5;--mute:#98a4ab;--line:#2a3035;--brand:#2fb1bd;--ok:#4cc38a;--warn:#f58327;--bad:#f06a58;--st-todo:#f0584a;--st-doing:#f5ae1f;--st-done:#2fb36b}}
*{box-sizing:border-box}
button,input,select,textarea{font-family:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 Poppins,system-ui,sans-serif;padding-bottom:92px}
header{position:sticky;top:0;background:var(--head);color:#fff;border-bottom:3px solid var(--brand);padding:10px 16px;display:flex;justify-content:space-between;align-items:center;z-index:5}
.logo{width:116px;height:38px;background:url(logo.png) no-repeat;background-size:143px 143px;background-position:-13px -47px}
header small{color:var(--brand);font-weight:700;letter-spacing:.14em;margin-left:6px;font-size:14px}
#sync{font-size:13px;opacity:.85;cursor:pointer}
main{max-width:760px;margin:0 auto;padding:14px 16px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;border:0;background:none;color:var(--mute);padding:14px 2px;font-size:15px;font-weight:500}
nav button.on{color:var(--brand);font-weight:700;border-top:3px solid var(--brand)}
h1{font-size:27px;font-weight:700;margin:4px 0 14px;line-height:1.2}
h2{font-size:21px;font-weight:700;margin:24px 0 10px}
h3{font-size:19px;font-weight:700;margin:0 0 10px}
h2.own{display:flex;align-items:center;gap:10px;border-bottom:3px solid var(--brand);padding-bottom:6px;margin-top:26px}
.cnt{background:var(--brand);color:#fff;border-radius:99px;font-size:14px;font-weight:600;padding:1px 11px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
button.b,a.b{display:inline-block;background:var(--pri);color:var(--pri-ink);border:0;border-radius:12px;padding:13px 18px;font-size:16px;font-weight:600;text-decoration:none;margin:4px 6px 4px 0}
button.b.big{display:block;width:100%;margin:0 0 6px;padding:15px;font-size:17px}
button.g{background:none;color:var(--brand);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:15px;font-weight:600;margin:4px 6px 4px 0}
button.s{padding:7px 12px;font-size:14px}
input,select,textarea{width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit;font-size:17px;margin:4px 0 10px}
textarea{min-height:130px}
label{font-size:14px;font-weight:600;color:var(--mute)}
.row{display:flex;gap:8px;align-items:flex-start}.row>*{flex:1}

.tbl{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.th,.tr{display:grid;grid-template-columns:42px 88px 1fr;column-gap:6px;padding:0 12px}
.th{padding-top:9px;padding-bottom:9px;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--mute);background:var(--bg);border-bottom:1px solid var(--line)}
.tr{padding-top:14px;padding-bottom:14px;border-bottom:1px solid var(--line);align-items:start}
.tr:last-child{border-bottom:0}
.dd b{font-size:16px;font-weight:700;display:block}.dd small{font-size:13px;font-weight:600}

.dot{display:block;width:28px;height:28px;border-radius:50%;background:var(--c,#999)}
.dot.todo{--c:var(--st-todo)}.dot.doing{--c:var(--st-doing)}.dot.done{--c:var(--st-done)}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font-size:17px;font-weight:600;margin:7px 0}

<body>
<header><div style="display:flex;align-items:center"><div class="logo" role="img" aria-label="Inflekt"></div><small>OS</small></div><span id="sync">not connected</span></header>
<main id="main"></main>

<div class="toast" id="toast"></div>

<script src="core.js"></script>
<script>
/* ============ tiny utils ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const b64e=s=>btoa(unescape(encodeURIComponent(s)));
const b64d=s=>decodeURIComponent(escape(atob(s.replace(/\n/g,''))));
const slug=s=>String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,50)||'note';
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',2600)}

/* ============ state + GitHub sync ============ */
const S={conn:LS.get('conn',{repo:'anandmenongrowth/inflekt-os-data',token:'',me:''}),d:{},tab:'today',filter:'me',ready:false};
const FILES={config:{},tasks:[],events:[],pipeline:[],decisions:[],imported:[]};
const API='https://api.github.com/repos/';
async function gh(path,opt={}){
  return fetch(API+S.conn.repo+path,{cache:'no-store',...opt,headers:{Authorization:'Bearer '+S.conn.token,Accept:'application/vnd.github+json',...(opt.headers||{})}});
}
async function rd(path,def){
  const r=await gh('/contents/'+path);
  if(r.status===404)return{json:def,sha:null};
  if(!r.ok)throw new Error(path+': '+r.status);
  const j=await r.json();
  return{json:JSON.parse(b64d(j.content)),sha:j.sha};
}
async function wrRaw(path,text,sha,msg){
  const body={message:msg,content:b64e(text)};if(sha)body.sha=sha;
  return gh('/contents/'+path,{method:'PUT',body:JSON.stringify(body)});
}
/** read-modify-write with retry, so simultaneous edits by 2 people merge instead of clobbering */
async function mutate(name,fn,msg){
  for(let i=0;i<5;i++){
    const {json,sha}=await rd('data/'+name+'.json',FILES[name]);
    const out=fn(json);
    if(out===false)return false;
    const r=await wrRaw('data/'+name+'.json',JSON.stringify(out,null,1),sha,(msg||('update '+name))+' ['+S.conn.me+']');
    if(r.ok){S.d[name]=out;return true}
    if(r.status!==409&&r.status!==422)throw new Error('write '+name+': '+r.status);
  }
  throw new Error('conflict on '+name+', try again');
}
async function saveText(path,text,msg){
  let sha=null;const r0=await gh('/contents/'+path);if(r0.ok)sha=(await r0.json()).sha;
  const r=await wrRaw(path,text,sha,msg+' ['+S.conn.me+']');
  if(!r.ok)throw new Error('save '+path+': '+r.status);
}
async function listDir(dir){
  const r=await gh('/contents/'+dir);
  if(r.status===404)return[];
  if(!r.ok)throw new Error(dir+': '+r.status);
  return (await r.json()).filter(f=>f.type==='file'&&/\.md$/.test(f.name)).map(f=>f.name).sort().reverse();
}
async function loadAll(){
  $('#sync').textContent='syncing…';
  try{
    for(const k of Object.keys(FILES)){S.d[k]=(await rd('data/'+k+'.json',FILES[k])).json}
    await materialize();
    S.ready=true;$('#sync').textContent='synced '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  }catch(e){$('#sync').textContent='sync failed';toast(e.message)}
  render();
}

/* ============ automation: recurring + event prep ============ */
async function materialize(){
  const adds=computeAdds(S.d);if(!adds.length)return;
  await mutate('tasks',list=>{const have=new Set(list.map(t=>t.key).filter(Boolean));const n=adds.filter(a=>!have.has(a.key));if(!n.length)return false;return list.concat(n)},'auto: recurring + prep tasks');
}
function autoOwner(t){ // fallback owner = track owner, else least loaded
  const c=S.d.config,tr=(c.tracks||[]).find(x=>x.name===t.track);if(tr&&tr.owner)return tr.owner;
  const load={};(c.team||[]).forEach(p=>load[p]=0);(S.d.tasks||[]).filter(x=>x.status!=='done'&&load[x.owner]!==undefined).forEach(x=>load[x.owner]++);
  return Object.keys(load).sort((a,b)=>load[a]-load[b])[0]||'';
}

/* ============ brief (WhatsApp-safe plain text) ============ */

/* ============ Claude hand-off ============ */
const OUT_SUFFIX='\n\nFormat the final answer as clean markdown: a title, a 5-line summary at the top, then sections. Cite sources and flag low-confidence claims.';
function fillTpl(body,subject,context){return body.replace(/{{subject}}/g,subject||'[subject]').replace(/{{context}}/g,context||'(none)')+OUT_SUFFIX}
function openClaude(prompt){
  const url='https://claude.ai/new?q='+encodeURIComponent(prompt);
  if(url.length<7500){window.open(url,'_blank');return true}
  copy(prompt);window.open('https://claude.ai/new','_blank');toast('Prompt too long for a link - copied. Paste in Claude.');return false;
}
function copy(text){
  try{navigator.clipboard.writeText(text)}catch(e){}
  const t=document.createElement('textarea');t.value=text;t.style.position='fixed';t.style.opacity=0;document.body.appendChild(t);t.select();try{document.execCommand('copy')}catch(e){}t.remove();
}
function extractPrompt(text,name){
  const c=S.d.config;
  return 'You are the task extractor for Inflekt OS. Today is '+ymd(today())+' ('+today().toLocaleDateString('en-GB',{weekday:'long'})+').\n'+
  'Team: '+(c.team||[]).join(', ')+'\nTracks: '+(c.tracks||[]).map(t=>t.name).join(' | ')+'\n\n'+
  'From the text below, return ONLY a JSON array, no prose. Each item: {"type":"task|decision|event|lead|reading","text":"short imperative","owner":"one of the team or empty","due":"YYYY-MM-DD or empty","track":"closest track or empty","priority":"P1|P2|P3","detail":"optional one line"}.\n'+
  'Rules: set owner only if explicitly assigned or unambiguous; never invent tasks; resolve relative dates against today; decisions = things agreed; event = a dated meeting/deadline; lead = a company to approach; reading = an article/link to read; skip chit-chat.\n\n'+
  (text?'SOURCE: '+(name||'notes')+'\n---\n'+text
   :'SOURCE: use the Granola connector. First list my meetings from the last 24 hours'+(name?' (and prefer the one named "'+name+'")':'')+'; then read the notes of each and extract from all of them. Add a "meeting" field (meeting title) to every item. If you cannot access Granola, tell me and stop.');
}

/* ============ Google Drive import (per-person sign-in, read-only) ============ */
let gTok=null,gExp=0;
function loadGis(){return new Promise((res,rej)=>{if(window.google&&google.accounts&&google.accounts.oauth2)return res();const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.onload=res;s.onerror=()=>rej(new Error('Could not load Google sign-in'));document.head.appendChild(s)})}
async function driveToken(){
  if(gTok&&Date.now()<gExp)return gTok;
  const cid=LS.get('gcid','');if(!cid)throw new Error('Add the Google client ID in Settings first');
  await loadGis();
  return new Promise((res,rej)=>{
    const tc=google.accounts.oauth2.initTokenClient({client_id:cid,scope:'https://www.googleapis.com/auth/drive.readonly',
      callback:r=>{if(r.error)return rej(new Error(r.error));gTok=r.access_token;gExp=Date.now()+(r.expires_in-60)*1000;LS.set('gseen',1);res(gTok)},
      error_callback:e=>rej(new Error((e&&e.type)||'Google sign-in cancelled'))});
    tc.requestAccessToken({prompt:LS.get('gseen',0)?'':'consent'});
  });
}
async function driveList(){
  const t=await driveToken(),folders=String(LS.get('gfolder','')).split(',').map(s=>s.trim()).filter(Boolean);
  const since=new Date(Date.now()-21*864e5).toISOString();
  let q="trashed=false and modifiedTime>'"+since+"' and (mimeType='application/vnd.google-apps.document' or mimeType='text/plain' or mimeType='text/markdown')";
  if(folders.length)q+=' and ('+folders.map(f=>"'"+f+"' in parents").join(' or ')+')';
  const r=await fetch('https://www.googleapis.com/drive/v3/files?pageSize=40&orderBy=modifiedTime%20desc&fields=files(id,name,modifiedTime,mimeType)&q='+encodeURIComponent(q),{headers:{Authorization:'Bearer '+t}});
  if(!r.ok)throw new Error('Drive '+r.status);
  return (await r.json()).files||[];
}
async function driveText(f){
  const t=await driveToken();
  const u=f.mimeType.startsWith('application/vnd.google-apps')?'https://www.googleapis.com/drive/v3/files/'+f.id+'/export?mimeType=text/plain':'https://www.googleapis.com/drive/v3/files/'+f.id+'?alt=media';
  const r=await fetch(u,{headers:{Authorization:'Bearer '+t}});if(!r.ok)throw new Error('Drive '+r.status);return r.text();
}
async function driveModal(){
  modal('<p class="mute">Opening Google sign-in…</p>');
  try{
    const files=await driveList(),done=new Set((S.d.imported||[]).map(x=>x.id));
    modal('<h2 style="margin-top:0">Notes from your Drive (last 3 weeks)</h2>'+(files.length?files.map((f,i)=>'<div class="card" data-d="'+i+'" style="cursor:pointer;'+(done.has(f.id)?'opacity:.5':'')+'"><b>'+esc(f.name)+'</b><br><small class="mute">'+fshort(new Date(f.modifiedTime))+(done.has(f.id)?' · already imported':' · new')+'</small></div>').join(''):'<p class="mute">No documents found. Set your meeting-notes folder ID in Settings.</p>')+'<button class="g" onclick="closeModal()">Close</button>');
    document.querySelectorAll('[data-d]').forEach(e=>e.onclick=async()=>{const f=files[+e.dataset.d];e.style.opacity=.6;
      try{const txt=await driveText(f);CAP={name:f.name,text:txt,items:null,driveId:f.id};closeModal();S.tab='capture';render();toast('Loaded - now open in Claude to extract')}catch(er){toast(er.message)}});
  }catch(e){modal('<p>'+esc(e.message)+'</p><button class="g" onclick="closeModal()">Close</button>')}
}

/* ============ markdown (small) ============ */
function md(src){
  let s=esc(src);const blocks=[];
  s=s.replace(/```[a-z]*\n?([\s\S]*?)```/g,(_,c)=>{blocks.push('<pre>'+c+'</pre>');return '\u0001'+(blocks.length-1)+'\u0001'});
  const inl=t=>t.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  let out='',list=null,tbl=[];
  const flush=()=>{if(list){out+='</'+list+'>';list=null}
    if(tbl.length){out+='<table>'+tbl.filter(r=>!/^\|?[\s:|-]+\|?$/.test(r)).map((r,i)=>'<tr>'+r.replace(/^\||\|$/g,'').split('|').map(c=>'<'+(i?'td':'th')+'>'+inl(c.trim())+'</'+(i?'td':'th')+'>').join('')+'</tr>').join('')+'</table>';tbl=[]}};
  s.split('\n').forEach(l=>{
    let m;
    if(/^\s*\|/.test(l)){if(list){flush()}tbl.push(l.trim());return}
    flush();
    if((m=l.match(/^(#{1,4})\s+(.*)/)))out+='<h'+(m[1].length+1)+'>'+inl(m[2])+'</h'+(m[1].length+1)+'>';
    else if((m=l.match(/^\s*[-*]\s+(.*)/))){if(list!=='ul'){flush();out+='<ul>';list='ul'}out+='<li>'+inl(m[1])+'</li>'}
    else if((m=l.match(/^\s*\d+[.)]\s+(.*)/))){if(list!=='ol'){flush();out+='<ol>';list='ol'}out+='<li>'+inl(m[1])+'</li>'}
    else if(/^\s*---+\s*$/.test(l))out+='<hr>';
    else if(!l.trim())out+='';
    else out+='<p>'+inl(l)+'</p>';
  });
  flush();
  return out.replace(/\u0001(\d+)\u0001/g,(_,i)=>blocks[+i]);
}

/* ============ modal helpers ============ */
function modal(html){$('#mbody').innerHTML=html;$('#modal').style.display='flex'}
function closeModal(){$('#modal').style.display='none';$('#mbody').innerHTML=''}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
function form(title,fields,onOk,okLabel){
  modal('<h2 style="margin-top:0">'+esc(title)+'</h2>'+fields.map(f=>{
    const v=f.val??'';
    if(f.type==='select')return '<label>'+f.label+'</label><select id="f_'+f.k+'">'+f.opts.map(o=>'<option'+(o===v?' selected':'')+'>'+esc(o)+'</option>').join('')+'</select>';
    if(f.type==='area')return '<label>'+f.label+'</label><textarea id="f_'+f.k+'">'+esc(v)+'</textarea>';
    return '<label>'+f.label+'</label><input id="f_'+f.k+'" type="'+(f.type||'text')+'" value="'+esc(v)+'">';
  }).join('')+'<button class="b" id="f_ok">'+(okLabel||'Save')+'</button><button class="g" onclick="closeModal()">Cancel</button>');
  $('#f_ok').onclick=async()=>{const o={};fields.forEach(f=>o[f.k]=$('#f_'+f.k).value);try{await onOk(o);closeModal()}catch(e){toast(e.message)}};
}

/* ============ views ============ */
const TABS=[['today','Today'],['tasks','Tasks'],['capture','Capture'],['outputs','Library'],['pipe','Pipeline']];
const ST={todo:'Yet to start',doing:'Picked up, WIP',done:'Done'};
function render(){
  const conn=S.conn.repo&&S.conn.token,m=$('#main');
  $('#nav').style.display=conn?'flex':'none';
  $('#nav').innerHTML=TABS.map(t=>'<button class="'+(S.tab===t[0]?'on':'')+'" data-tab="'+t[0]+'">'+t[1]+'</button>').join('');
  if(!conn){S.tab='set';return renderSettings(m)}
  if(S.tab==='set')return renderSettings(m);
  if(!S.ready){m.innerHTML='<p class="mute">Loading from GitHub…</p>';return}
  ({today:renderToday,tasks:renderTasks,capture:renderCapture,outputs:renderLibrary,pipe:renderPipe})[S.tab](m);
}
$('#nav').addEventListener('click',e=>{const t=e.target.dataset.tab;if(t){S.tab=t;render()}});
$('#sync').addEventListener('click',()=>{S.tab='set';render()});

/* one task row: [status dot] [deadline] [task + details]. mode: 'open' | 'done' */
function taskRow(t,o){
  o=o||{};const td=today(),d=pd(t.due),od=d&&d<td&&t.status!=='done';
  const dateTxt=o.mode==='done'?(pd(t.doneOn)?fshort(pd(t.doneOn)):'-'):(d?fshort(d):'No date');
  const sub=[];
  if(t.status==='doing')sub.push('WIP, ETA '+(pd(t.eta)?fshort(pd(t.eta)):'not set'));
  if(o.owner)sub.push(esc(t.owner||'unassigned'));
  if(t.track)sub.push(esc(t.track));
  return '<div class="tr" data-id="'+t.id+'"><button class="dotbtn" data-act="status" aria-label="'+ST[t.status]+'"><span class="dot '+t.status+'"></span></button>'+
   '<div class="dd"><b class="'+(od?'over':'')+'">'+dateTxt+'</b>'+(od?'<small class="over">overdue '+diff(d,td)+'d</small>':'')+'</div>'+
   '<div><div class="ttl">'+esc(t.title)+'</div>'+(sub.length?'<div class="sub">'+sub.join(' · ')+'</div>':'')+

function statusModal(t){

    modal('<h3>'+esc(t.title)+'</h3>'+['todo','doing','done'].map(s=>'<button class="opt'+(pick===s?' sel':'')+'" data-s="'+s+'"><span class="dot '+s+'"></span>'+ST[s]+'</button>').join('')+
      (pick==='doing'?'<label>Expected deadline (required)</label><input type="date" id="st_eta" value="'+esc(eta)+'">':'')+
      '<button class="b" id="st_ok">Save</button><button class="g" onclick="closeModal()">Cancel</button>');
    document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const e=$('#st_eta');if(e)eta=e.value;pick=b.dataset.s;draw()});
    $('#st_ok').onclick=async()=>{
      const e=$('#st_eta');if(e)eta=e.value;
      if(pick==='doing'&&!eta)return toast('Add the expected deadline');
      try{await mutate('tasks',l=>{const x=l.find(y=>y.id===t.id);if(!x)return false;x.status=pick;x.eta=pick==='doing'?eta:'';x.doneOn=pick==='done'?ymd(today()):'';return l},'status: '+ST[pick]);closeModal();render()}
      catch(er){toast(er.message)}
    };
  };
  draw();

function editTask(t){
  const c=S.d.config,tpls=['(none)',...(c.prompts||[]).map(p=>p.name)];
  const fs=[{k:'title',label:'Task',val:t?.title},{k:'owner',label:'Owner',type:'select',opts:['',...c.team],val:t?.owner||''},{k:'due',label:'Due',type:'date',val:t?.due},
   {k:'pri',label:'Priority',type:'select',opts:['P1','P2','P3'],val:t?.pri||'P2'},{k:'track',label:'Track',type:'select',opts:['',...(c.tracks||[]).map(x=>x.name)],val:t?.track||''}];
  if(!t){fs.push({k:'tpl',label:'Claude prompt template (optional)',type:'select',opts:tpls},{k:'subject',label:'Subject for the prompt (e.g. brand name)'},{k:'context',label:'Extra context (optional)',type:'area'})}
  form(t?'Edit task':'New task',fs,async o=>{
    if(!o.title.trim())throw new Error('Task text needed');
    if(t){await mutate('tasks',l=>{const x=l.find(y=>y.id===t.id);if(!x)return false;Object.assign(x,{title:o.title,owner:o.owner,due:o.due,pri:o.pri,track:o.track});return l},'edit task')}
    else{const n=mk({title:o.title,owner:o.owner,due:o.due,pri:o.pri,track:o.track,source:'Manual'});if(!n.owner)n.owner=autoOwner(n);
      if(o.tpl!=='(none)')n.ai={tpl:o.tpl,subject:o.subject,context:o.context};
      await mutate('tasks',l=>l.concat(n),'add task')}
    render();
  });
}
function claudeModal(t){
  const c=S.d.config,P=c.prompts||[];
  const cur={tpl:t?.ai?.tpl||(P[0]&&P[0].name),subject:t?.ai?.subject||'',context:t?.ai?.context||''};
  const draw=()=>{
    const tp=P.find(p=>p.name===cur.tpl);
    modal('<h2 style="margin-top:0">Ask Claude'+(t?': '+esc(t.title):'')+'</h2>'+
      '<label>Template</label><select id="c_tpl">'+P.map(p=>'<option'+(p.name===cur.tpl?' selected':'')+'>'+esc(p.name)+'</option>').join('')+'</select>'+
      '<label>Subject (brand / topic)</label><input id="c_sub" value="'+esc(cur.subject)+'">'+
      '<label>Extra context</label><input id="c_ctx" value="'+esc(cur.context)+'">'+
      '<label>Prompt - edit freely before sending</label><textarea id="c_p" style="min-height:190px">'+esc(fillTpl(tp?tp.body:'{{subject}}',cur.subject,cur.context))+'</textarea>'+
      '<button class="b" id="c_open">Open in Claude</button><button class="g" id="c_copy">Copy prompt</button>'+
      '<h2>When Claude is done</h2><p class="mute" style="margin:0 0 6px">Copy Claude\'s answer, paste it here. It saves to the shared library for everyone.</p>'+
      '<label>Title</label><input id="c_title" value="'+esc((t?t.title:cur.subject)||'')+'">'+
      '<label>Claude\'s output</label><textarea id="c_out" style="min-height:140px"></textarea>'+
      '<button class="b" id="c_save">Save to library</button><button class="g" onclick="closeModal()">Close</button>');
    $('#c_tpl').onchange=()=>{cur.tpl=$('#c_tpl').value;cur.subject=$('#c_sub').value;cur.context=$('#c_ctx').value;draw()};
    const regen=()=>{const tp2=P.find(p=>p.name===$('#c_tpl').value);cur.subject=$('#c_sub').value;cur.context=$('#c_ctx').value;$('#c_p').value=fillTpl(tp2?tp2.body:'{{subject}}',cur.subject,cur.context)};
    $('#c_sub').oninput=regen;$('#c_ctx').oninput=regen;
    $('#c_open').onclick=async()=>{openClaude($('#c_p').value);if(t&&t.status==='todo'){try{await mutate('tasks',l=>{const x=l.find(y=>y.id===t.id);if(!x)return false;x.status='doing';return l},'task started')}catch(e){}}};
    $('#c_copy').onclick=()=>{copy($('#c_p').value);toast('Copied')};
    $('#c_save').onclick=async()=>{
      const body=$('#c_out').value.trim(),title=$('#c_title').value.trim()||'Untitled';
      if(!body)return toast('Paste Claude\'s output first');
      const path='outputs/'+ymd(today())+'_'+slug(title)+'.md';
      try{
        await saveText(path,'# '+title+'\n\n_Saved by '+S.conn.me+' on '+ymd(today())+(t?' · task: '+t.title:'')+'_\n\n'+body.replace(/^# .*\n+/,''),'output: '+title);
        if(t)await mutate('tasks',l=>{const x=l.find(y=>y.id===t.id);if(!x)return false;x.output=path;return l},'link output');
        closeModal();toast('Saved to library');S.tab='outputs';render();
      }catch(e){toast(e.message)}
    };
  };
  draw();
}

async function pushItems(){
  const src='Meeting: '+(CAP.name||'notes'),sel=CAP.items.filter(i=>i.on&&String(i.text||'').trim());
  try{
    const tasks=sel.filter(i=>i.type==='task').map(i=>{const t=mk({title:i.text,owner:i.owner,due:i.due,pri:i.priority,track:i.track,source:src,notes:i.detail});if(!t.owner)t.owner=autoOwner(t);return t});
    const events=sel.filter(i=>i.type==='event').map(i=>({id:uid(),date:i.due,event:i.text,template:'',owner:i.owner||S.conn.me,track:i.track||'',notes:i.detail||''}));
    const leads=sel.filter(i=>i.type==='lead').map(i=>({id:uid(),company:i.text,stage:'Lead',owner:i.owner||'',retainer:'',prob:'',last:'',next:i.detail||'',nextDate:i.due||''}));
    const decs=sel.filter(i=>i.type==='decision'||i.type==='reading').map(i=>({id:uid(),date:ymd(today()),type:i.type,text:i.text,owner:i.owner||'',source:src,detail:i.detail||''}));
    if(tasks.length)await mutate('tasks',l=>l.concat(tasks),'meeting tasks: '+CAP.name);
    if(events.length)await mutate('events',l=>l.concat(events),'events from '+CAP.name);
    if(leads.length)await mutate('pipeline',l=>l.concat(leads),'leads from '+CAP.name);
    if(decs.length)await mutate('decisions',l=>l.concat(decs),'decisions from '+CAP.name);
    if(CAP.driveId){const rec={id:CAP.driveId,name:CAP.name,by:S.conn.me,at:ymd(today())};await mutate('imported',l=>l.some(x=>x.id===rec.id)?false:l.concat(rec),'imported '+CAP.name)}

    toast('Pushed '+sel.length+' items');CAP={name:'',text:'',items:null};S.tab='tasks';S.filter='all';render();
  }catch(e){toast(e.message)}
}

if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
if(S.conn.repo&&S.conn.token)loadAll();else render();
</script>
