<html lang="en">
<head>

<style>
:root{--bg:#f4f6f7;--card:#fff;--ink:#16191b;--mute:#5d6a72;--line:#dfe5e8;--pri:#1b7f88;--pri-ink:#fff;--brand:#2296a0;--ok:#1a7f4b;--warn:#d97c1d;--bad:#d9382a;--head:#0e0f11;--trk:#16727b;--st-todo:#e5483a;--st-doing:#f2a10c;--st-done:#1f9d55}
@media(prefers-color-scheme:dark){:root{--bg:#0e0f11;--card:#17191c;--ink:#f1f4f5;--mute:#98a4ab;--line:#2a3035;--brand:#2fb1bd;--trk:#4fc3cd;--ok:#4cc38a;--warn:#f58327;--bad:#f06a58;--st-todo:#f0584a;--st-doing:#f5ae1f;--st-done:#2fb36b}}
*{box-sizing:border-box}
button,input,select,textarea{font-family:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Poppins,system-ui,sans-serif;padding-bottom:92px}
header{position:sticky;top:0;background:var(--head);color:#fff;border-bottom:3px solid var(--brand);padding:10px 16px;display:flex;justify-content:space-between;align-items:center;z-index:5}
.logo{width:116px;height:38px;background:url(logo.png) no-repeat;background-size:143px 143px;background-position:-13px -47px}
header small{color:var(--brand);font-weight:700;letter-spacing:.14em;margin-left:6px;font-size:14px}
#sync{font-size:13px;opacity:.85;cursor:pointer}
main{max-width:760px;margin:0 auto;padding:14px 16px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;border:0;background:none;color:var(--mute);padding:14px 2px;font-size:15px;font-weight:500}
nav button.on{color:var(--brand);font-weight:700;border-top:3px solid var(--brand)}
h1{font-size:24px;font-weight:700;margin:4px 0 14px;line-height:1.2}
h2{font-size:19px;font-weight:700;margin:20px 0 8px}
h3{font-size:18px;font-weight:700;margin:0 0 10px}
h2.own{display:flex;align-items:center;gap:10px;border-bottom:3px solid var(--brand);padding-bottom:6px;margin-top:26px}
.cnt{background:var(--brand);color:#fff;border-radius:99px;font-size:12.5px;font-weight:600;padding:1px 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
button.b,a.b{display:inline-block;background:var(--pri);color:var(--pri-ink);border:0;border-radius:12px;padding:13px 18px;font-size:16px;font-weight:600;text-decoration:none;margin:4px 6px 4px 0}
button.b.big{display:block;width:100%;margin:0 0 6px;padding:15px;font-size:17px}
button.g{background:none;color:var(--brand);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:15px;font-weight:600;margin:4px 6px 4px 0}
button.s{padding:5px 10px;font-size:13px;margin:3px 5px 3px 0}
input,select,textarea{width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit;font-size:17px;margin:4px 0 10px}
textarea{min-height:130px}
label{font-size:14px;font-weight:600;color:var(--mute)}
.row{display:flex;gap:8px;align-items:flex-start}.row>*{flex:1}
.chip{display:inline-block;flex:none;border:1px solid var(--line);border-radius:99px;padding:3px 12px;font-size:13.5px;font-weight:500;background:var(--card);color:var(--ink);line-height:1.5}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand);font-weight:600}
.chips{display:flex;gap:6px;overflow-x:auto;white-space:nowrap;margin:0 0 6px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.ctl{display:flex;gap:8px;align-items:center;margin:6px 0 10px}.ctl select{flex:1;margin:0;padding:7px 10px;font-size:14px;border-radius:9px}.ctl button.b{margin:0;padding:8px 14px;font-size:14px;border-radius:9px;white-space:nowrap}
.tbl{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.th,.tr{display:grid;grid-template-columns:38px 80px 1fr;column-gap:6px;padding:0 12px}
.th{padding-top:7px;padding-bottom:7px;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--mute);background:var(--bg);border-bottom:1px solid var(--line)}
.tr{padding-top:12px;padding-bottom:12px;border-bottom:1px solid var(--line);align-items:start}
.tr:last-child{border-bottom:0}
.dd b{font-size:15px;font-weight:700;display:block}.dd small{font-size:13px;font-weight:600}
.ttl{font-size:16px;font-weight:500;line-height:1.4}
.sub{font-size:13px;color:var(--mute);margin-top:3px}.trk{color:var(--trk);font-weight:600}
.acts{margin-top:6px}
.dotbtn{border:0;background:none;padding:4px 6px 4px 0;margin:0;cursor:pointer}
.dot{display:block;width:24px;height:24px;border-radius:50%;background:var(--c,#999)}
.dot.todo{--c:var(--st-todo)}.dot.doing{--c:var(--st-doing)}.dot.done{--c:var(--st-done)}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font-size:17px;font-weight:600;margin:7px 0}
.opt.sel{border-color:var(--brand)}
.flags{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 14px 6px 30px;margin:0}
.flags ul{margin:6px 0 2px;padding-left:20px;list-style:circle}.flags ul li{border:0;padding:3px 0;font-size:14px;color:var(--mute)}
.flags li{padding:8px 0;font-size:14.5px;border-bottom:1px solid var(--line)}.flags li:last-child{border-bottom:0}
.P1{color:var(--bad);font-weight:700}.P2{color:var(--warn)}.P3{color:var(--mute)}
.over{color:var(--bad)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:9}
#modal .in{background:var(--card);width:100%;max-width:760px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px}
.md{font-size:17px}.md h2,.md h3,.md h4,.md h5{font-weight:700}
.md pre{background:var(--bg);padding:10px;overflow:auto;border-radius:8px}.md table{border-collapse:collapse;width:100%;font-size:15px;display:block;overflow:auto}.md td,.md th{border:1px solid var(--line);padding:7px 10px}.md th{font-weight:700}.md code{background:var(--bg);padding:1px 5px;border-radius:4px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:104px;background:#222;color:#fff;padding:11px 18px;border-radius:99px;font-size:15px;z-index:20;display:none}
.mute{color:var(--mute)}
.dl{display:inline-block;border-radius:8px;padding:1px 8px;font-weight:700;font-size:14px;white-space:nowrap}
.dl.over{background:#f4c7c3;color:#7a1d14}.dl.soon{background:#fce8b2;color:#6b4a00}.dl.done{background:#b7e1cd;color:#14502f}
.dl.later,.dl.none,.dl.drop{background:transparent;color:var(--ink);padding-left:0}
@media(prefers-color-scheme:dark){.dl.over{background:#5a2420;color:#ffd5d0}.dl.soon{background:#5a4510;color:#ffe9a8}.dl.done{background:#1c4a33;color:#bff0d6}}
.dd small{display:block;font-size:12px;font-weight:600;margin-top:2px}
.dot.waiting{--c:#4a90d9}.dot.dropped{--c:#8b96a1}
.note{font-size:14px;border-left:3px solid var(--brand);padding-left:9px;margin-top:6px}
.ptiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:0 0 12px}
.ptile{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--brand);border-radius:12px;padding:8px 6px;text-align:center}
.pn{font-size:22px;font-weight:700;line-height:1.2}.pl{font-size:11.5px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}.ps{font-size:12px;font-weight:600;color:var(--mute)}
.pgrid{grid-template-columns:minmax(0,1fr) 70px 88px}
.prow{cursor:pointer}.prow .pmain b{font-size:15.5px;font-weight:600}.pd{font-size:13px;color:var(--mute);font-weight:500}
.pill{display:inline-block;color:#fff;font-size:12px;font-weight:700;border-radius:99px;padding:2px 10px}
.pdet{grid-column:1/-1;margin-top:10px;font-size:14px}.pk{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);margin-right:6px}.pms{white-space:pre-line;font-size:14px}
.evh{display:flex;align-items:center;gap:10px;border-bottom:3px solid #6b5bd2;padding-bottom:6px;margin:18px 0 8px}.evh h2{margin:0;color:#5b4bc4}.evh .cnt{background:#6b5bd2}
.rvev{background:#f1eefc;border-left:6px solid #6b5bd2}@media(prefers-color-scheme:dark){.rvev{background:#241f3d}}
#mbody textarea{min-height:84px}
.badge{display:inline-block;font-size:12px;font-weight:700;border-radius:6px;padding:1px 7px;background:#fce8b2;color:#6b4a00;margin-left:8px;vertical-align:middle}
.cnt.ok{background:var(--st-done)}
</style>

<body>
<header><div style="display:flex;align-items:center"><div class="logo" role="img" aria-label="Inflekt"></div><small>OS</small></div><span id="sync">not connected</span></header>
<main id="main"></main>
<nav id="nav"></nav>
<div id="modal"><div class="in" id="mbody"></div></div>
<div class="toast" id="toast"></div>

<script src="core.js?v=7"></script>
<script>
/* ============ tiny utils ============ */
const coreOK=(typeof CORE_V!=='undefined'&&CORE_V>=7);
if(!coreOK&&!sessionStorage.getItem('rl')){sessionStorage.setItem('rl','1');(async()=>{try{for(const r of await navigator.serviceWorker.getRegistrations())await r.unregister();for(const k of await caches.keys())await caches.delete(k)}catch(e){}location.reload()})()}
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const b64e=s=>btoa(unescape(encodeURIComponent(s)));
const b64d=s=>decodeURIComponent(escape(atob(s.replace(/\n/g,''))));
const slug=s=>String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,50)||'note';
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',2600)}

/* ============ state + GitHub sync ============ */
const S={conn:LS.get('conn',{repo:'Inflekt-Growth/inflekt-os-data',token:'',me:''}),d:{},tab:'today',filter:'me',ready:false};
if(S.conn.repo==='anandmenongrowth/inflekt-os-data'){S.conn.repo='Inflekt-Growth/inflekt-os-data';LS.set('conn',S.conn)}   // repo moved to the organisation
const FILES={config:{},tasks:[],pipeline:[],imported:[],meetings:[],inbox:[],transcripts:[]};
const API='https://api.github.com/repos/';
async function gh(path,opt={}){
  return fetch(API+S.conn.repo+path,{cache:'no-store',...opt,headers:{Authorization:'Bearer '+S.conn.token,Accept:'application/vnd.github+json',...(opt.headers||{})}});
}
const RC={};   // path -> {etag,json,sha}: conditional requests (304) cost nothing against GitHub's rate limit
async function rd(path,def){
  const c=RC[path],h={};if(c&&c.etag)h['If-None-Match']=c.etag;
  const r=await gh('/contents/'+path,{headers:h});
  if(r.status===304&&c)return{json:JSON.parse(JSON.stringify(c.json)),sha:c.sha,same:true};
  if(r.status===404)return{json:def,sha:null};
  if(!r.ok)throw new Error(path+': '+r.status);
  const j=await r.json(),json=JSON.parse(b64d(j.content));
  RC[path]={etag:r.headers.get('ETag'),json,sha:j.sha};
  return{json:JSON.parse(JSON.stringify(json)),sha:j.sha};
}
/** Optimistic write: update the screen instantly, save to GitHub in the background, roll back + tell the user if it fails. */
let pending=0,BUSY=false;
/** add items by id only if absent: running it twice (double tap, retry) can never create duplicates */
const addOnce=(l,items)=>{const ids=new Set(l.map(x=>x.id));return l.concat(items.filter(x=>!ids.has(x.id)))};
/** run an async action once: ignore further taps while it runs, grey out the button and say "Saving..." */
async function once(btn,fn){
  if(BUSY)return;BUSY=true;const old=btn?btn.textContent:'';
  if(btn){btn.disabled=true;btn.textContent='Saving…'}
  try{await fn()}finally{BUSY=false;if(btn&&btn.isConnected){btn.disabled=false;btn.textContent=old}}
}
function optimistic(name,fn,msg){
  const before=JSON.stringify(S.d[name]);
  try{const out=fn(JSON.parse(before));if(out!==false)S.d[name]=out}catch(e){}
  render();pending++;
  return mutate(name,fn,msg).then(()=>toast('Saved')).catch(e=>{S.d[name]=JSON.parse(before);render();toast('Could not save - '+e.message)}).finally(()=>{pending--});
}
/** Pull other people's changes: every 45s while open, and whenever the app comes back to the foreground. */
async function syncData(){
  if(pending||document.hidden||!S.ready||!(S.conn.repo&&S.conn.token))return;
  try{
    let changed=false;
    for(const k of Object.keys(FILES)){const r=await rd('data/'+k+'.json',FILES[k]);if(!r.same&&JSON.stringify(r.json)!==JSON.stringify(S.d[k])){S.d[k]=r.json;changed=true}}
    $('#sync').textContent='synced '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
    if(changed){if($('#modal').style.display==='flex')S.dirty=true;else if(S.tab==='capture'){$('#nav').innerHTML=navHtml();refreshInbox()}else if(S.tab!=='set')render()}
  }catch(e){}
}
setInterval(syncData,45000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncData()});
async function wrRaw(path,text,sha,msg){
  const body={message:msg,content:b64e(text)};if(sha)body.sha=sha;
  return gh('/contents/'+path,{method:'PUT',body:JSON.stringify(body)});
}
/** read-modify-write with retry, so simultaneous edits by 2 people merge instead of clobbering */
async function mutate(name,fn,msg){
  for(let i=0;i<5;i++){
    const {json,sha}=await rd('data/'+name+'.json',FILES[name]);
    const out=fn(json);
    if(out===false)return false;
    const r=await wrRaw('data/'+name+'.json',JSON.stringify(out,null,1),sha,(msg||('update '+name))+' ['+S.conn.me+']');
    if(r.ok){S.d[name]=out;return true}
    if(r.status!==409&&r.status!==422)throw new Error('write '+name+': '+r.status);
  }
  throw new Error('conflict on '+name+', try again');
}
async function saveText(path,text,msg){
  let sha=null;const r0=await gh('/contents/'+path);if(r0.ok)sha=(await r0.json()).sha;
  const r=await wrRaw(path,text,sha,msg+' ['+S.conn.me+']');
  if(!r.ok)throw new Error('save '+path+': '+r.status);
}
async function listDir(dir){
  const r=await gh('/contents/'+dir);
  if(r.status===404)return[];
  if(!r.ok)throw new Error(dir+': '+r.status);
  return (await r.json()).filter(f=>f.type==='file'&&/\.md$/.test(f.name)).map(f=>f.name).sort().reverse();
}
/** delete a library file from the repo; tasks that pointed at it lose the "View output" link */
async function delFile(path){
  const r0=await gh('/contents/'+path);
  if(r0.status===404)return;
  if(!r0.ok)throw new Error('delete '+path+': '+r0.status);
  const sha=(await r0.json()).sha;
  const r=await gh('/contents/'+path,{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:'delete '+path+' ['+S.conn.me+']',sha})});
  if(!r.ok)throw new Error('delete failed: '+r.status);
  if(path.startsWith('notes/')){await optimistic('meetings',l=>l.filter(x=>x.path!==path),'meeting index')}
  if((S.d.tasks||[]).some(t=>t.output===path))await optimistic('tasks',l=>{l.forEach(t=>{if(t.output===path)t.output=''});return l},'clear output link');
}
async function loadAll(){
  $('#sync').textContent='syncing…';
  try{
    for(const k of Object.keys(FILES)){S.d[k]=(await rd('data/'+k+'.json',FILES[k])).json}
    await materialize();
    S.ready=true;S.err='';$('#sync').textContent='synced '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  }catch(e){$('#sync').textContent='sync failed';S.err=e.message;toast(e.message)}
  render();
}

/* ============ automation: recurring tasks ============ */
async function materialize(){
  const adds=computeAdds(S.d);if(!adds.length)return;
  await mutate('tasks',list=>{const have=new Set(list.map(t=>t.key).filter(Boolean));const n=adds.filter(a=>!have.has(a.key));if(!n.length)return false;return list.concat(n)},'auto: recurring tasks');
}
function autoOwner(t){ // fallback owner = track owner, else least loaded
  const c=S.d.config,tr=(c.tracks||[]).find(x=>x.name===t.track);if(tr&&tr.owner)return tr.owner;
  const load={};(c.team||[]).forEach(p=>load[p]=0);(S.d.tasks||[]).filter(x=>x.status!=='done'&&load[x.owner]!==undefined).forEach(x=>load[x.owner]++);
  return Object.keys(load).sort((a,b)=>load[a]-load[b])[0]||'';
}

/* ============ brief (WhatsApp-safe plain text) ============ */

/* ============ Claude hand-off ============ */
const OUT_SUFFIX='\n\nFormat the final answer as clean markdown: a title, a 5-line summary at the top, then sections. Cite sources and flag low-confidence claims.';
function fillTpl(body,subject,context){return body.replace(/{{subject}}/g,subject||'[subject]').replace(/{{context}}/g,context||'(none)')+OUT_SUFFIX}
function openClaude(prompt){
  const url='https://claude.ai/new?q='+encodeURIComponent(prompt);
  if(url.length<7500){window.open(url,'_blank');return true}
  copy(prompt);window.open('https://claude.ai/new','_blank');toast('Prompt too long for a link - copied. Paste in Claude.');return false;
}
function copy(text){
  try{navigator.clipboard.writeText(text)}catch(e){}
  const t=document.createElement('textarea');t.value=text;t.style.position='fixed';t.style.opacity=0;document.body.appendChild(t);t.select();try{document.execCommand('copy')}catch(e){}t.remove();
}
/* ============ Google Drive import (per-person sign-in, read-only) ============ */
let gTok=null,gExp=0;
function loadGis(){return new Promise((res,rej)=>{if(window.google&&google.accounts&&google.accounts.oauth2)return res();const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.onload=res;s.onerror=()=>rej(new Error('Could not load Google sign-in'));document.head.appendChild(s)})}
async function driveToken(){
  if(gTok&&Date.now()<gExp)return gTok;
  const cid=LS.get('gcid','');if(!cid)throw new Error('Add the Google client ID in Settings first');
  await loadGis();
  return new Promise((res,rej)=>{
    const tc=google.accounts.oauth2.initTokenClient({client_id:cid,scope:'https://www.googleapis.com/auth/drive.readonly',
      callback:r=>{if(r.error)return rej(new Error(r.error));gTok=r.access_token;gExp=Date.now()+(r.expires_in-60)*1000;LS.set('gseen',1);res(gTok)},
      error_callback:e=>rej(new Error((e&&e.type)||'Google sign-in cancelled'))});
    tc.requestAccessToken({prompt:LS.get('gseen',0)?'':'consent'});
  });
}
async function driveList(){
  const t=await driveToken(),folders=String(LS.get('gfolder','')).split(',').map(s=>s.trim()).filter(Boolean);
  const since=new Date(Date.now()-21*864e5).toISOString();
  let q="trashed=false and modifiedTime>'"+since+"' and (mimeType='application/vnd.google-apps.document' or mimeType='text/plain' or mimeType='text/markdown')";
  if(folders.length)q+=' and ('+folders.map(f=>"'"+f+"' in parents").join(' or ')+')';
  const r=await fetch('https://www.googleapis.com/drive/v3/files?pageSize=40&orderBy=modifiedTime%20desc&fields=files(id,name,modifiedTime,mimeType)&q='+encodeURIComponent(q),{headers:{Authorization:'Bearer '+t}});
  if(!r.ok)throw new Error('Drive '+r.status);
  return (await r.json()).files||[];
}
async function driveText(f){
  const t=await driveToken();
  const u=f.mimeType.startsWith('application/vnd.google-apps')?'https://www.googleapis.com/drive/v3/files/'+f.id+'/export?mimeType=text/plain':'https://www.googleapis.com/drive/v3/files/'+f.id+'?alt=media';
  const r=await fetch(u,{headers:{Authorization:'Bearer '+t}});if(!r.ok)throw new Error('Drive '+r.status);return r.text();
}
async function driveModal(){
  modal('<p class="mute">Opening Google sign-in…</p>');
  try{
    const files=await driveList(),done=new Set((S.d.imported||[]).map(x=>x.id));

/* ============ markdown (small) ============ */
function md(src){
  let s=esc(src);const blocks=[];
  s=s.replace(/```[a-z]*\n?([\s\S]*?)```/g,(_,c)=>{blocks.push('<pre>'+c+'</pre>');return '\u0001'+(blocks.length-1)+'\u0001'});
  const inl=t=>t.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  let out='',list=null,tbl=[];
  const flush=()=>{if(list){out+='</'+list+'>';list=null}
    if(tbl.length){out+='<table>'+tbl.filter(r=>!/^\|?[\s:|-]+\|?$/.test(r)).map((r,i)=>'<tr>'+r.replace(/^\||\|$/g,'').split('|').map(c=>'<'+(i?'td':'th')+'>'+inl(c.trim())+'</'+(i?'td':'th')+'>').join('')+'</tr>').join('')+'</table>';tbl=[]}};
  s.split('\n').forEach(l=>{
    let m;
    if(/^\s*\|/.test(l)){if(list){flush()}tbl.push(l.trim());return}
    flush();
    if((m=l.match(/^(#{1,4})\s+(.*)/)))out+='<h'+(m[1].length+1)+'>'+inl(m[2])+'</h'+(m[1].length+1)+'>';
    else if((m=l.match(/^\s*[-*]\s+(.*)/))){if(list!=='ul'){flush();out+='<ul>';list='ul'}out+='<li>'+inl(m[1])+'</li>'}
    else if((m=l.match(/^\s*\d+[.)]\s+(.*)/))){if(list!=='ol'){flush();out+='<ol>';list='ol'}out+='<li>'+inl(m[1])+'</li>'}
    else if(/^\s*---+\s*$/.test(l))out+='<hr>';
    else if(!l.trim())out+='';
    else out+='<p>'+inl(l)+'</p>';
  });
  flush();
  return out.replace(/\u0001(\d+)\u0001/g,(_,i)=>blocks[+i]);
}

const ST={todo:'Yet to start',doing:'Picked up, WIP',waiting:'Waiting on someone',done:'Done',dropped:'Dropped'};
const logAdd=(x,k,t)=>{(x.log=x.log||[]).push({at:ymd(today()),by:S.conn.me,k,t})};
function taskRow(t,o){
  o=o||{};const td=today(),d=pd(t.due),bd=band(t,td),n=lastNote(t);
  let dateTxt,small='';
  if(o.mode==='done'){dateTxt=pd(t.doneOn)?fshort(pd(t.doneOn)):'-'}
  else{dateTxt=d?fshort(d):'No date';if(bd==='over')small='overdue '+diff(d,td)+'d';else if(d&&diff(td,d)===0&&bd==='soon')small='today';else if(bd==='soon')small='tomorrow'}
  const sub=[];
  if(t.status==='doing')sub.push('WIP, ETA '+(pd(t.eta)?fshort(pd(t.eta)):'not set'));
  if(t.status==='waiting')sub.push('Waiting on '+esc(t.waitingOn||'someone')+(pd(t.waitSince)?', '+diff(pd(t.waitSince),td)+'d':''));
  if(t.status==='dropped')sub.push('Dropped');
  if(o.owner)sub.push(esc(t.owner||'unassigned'));
  if(t.track)sub.push('<span class="trk">'+esc(tn(t.track))+'</span>');
  if(o.raised&&pd(t.created))sub.push('raised '+fshort(pd(t.created)));
  const badge=(t.slips||0)>0?'<span class="badge">moved '+t.slips+'x</span>':'';
  return '<div class="tr" data-id="'+t.id+'"><button class="dotbtn" data-act="status" aria-label="'+ST[t.status]+'"><span class="dot '+t.status+'"></span></button>'+
   '<div class="dd"><span class="dl '+bd+'">'+dateTxt+'</span>'+(small?'<small class="'+(bd==='over'?'over':'mute')+'">'+small+'</small>':'')+'</div>'+
   '<div><div class="ttl">'+esc(t.title)+badge+'</div>'+(sub.length?'<div class="sub">'+sub.join(' · ')+'</div>':'')+
   (n?'<div class="note">'+esc(n.t)+' <span class="mute">- '+esc(n.by||'')+', '+fshort(pd(n.at))+'</span></div>':'')+
   (o.acts===false?'':'<div class="acts"><button class="g s" data-act="claude">Ask Claude</button>'+(t.output?'<button class="g s" data-act="view">View output</button>':'')+'</div>')+'</div></div>';

function statusModal(t){
  let pick=t.status,eta=t.eta||'',who=t.waitingOn||'',txt='';
  const keep=()=>{const a=$('#st_eta'),b=$('#st_who'),c=$('#st_txt');if(a)eta=a.value;if(b)who=b.value;if(c)txt=c.value};
  const draw=()=>{
    modal('<h3>'+esc(t.title)+'</h3>'+['todo','doing','waiting','done','dropped'].map(s=>'<button class="opt'+(pick===s?' sel':'')+'" data-s="'+s+'"><span class="dot '+s+'"></span>'+ST[s]+'</button>').join('')+
      (pick==='doing'?'<label>Expected deadline (required)</label><input type="date" id="st_eta" value="'+esc(eta)+'">':'')+
      (pick==='waiting'?'<label>Waiting on whom? (required)</label><input id="st_who" value="'+esc(who)+'" placeholder="e.g. client, designer, Venkat">':'')+
      (pick==='done'?'<label>What happened? One line (optional)</label><input id="st_txt" value="'+esc(txt)+'" placeholder="Outcome / link to what was delivered">':'')+
      (pick==='dropped'?'<label>Why dropped? (required)</label><input id="st_txt" value="'+esc(txt)+'">':'')+
      '<button class="b" id="st_ok">Save</button><button class="g" onclick="closeModal()">Cancel</button>');
    document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{keep();pick=b.dataset.s;draw()});
    $('#st_ok').onclick=async()=>{
      keep();
      if(pick==='doing'&&!eta)return toast('Add the expected deadline');
      if(pick==='waiting'&&!who.trim())return toast('Say who you are waiting on');
      if(pick==='dropped'&&!txt.trim())return toast('Add a one-line reason');
      try{closeModal();optimistic('tasks',l=>{const x=l.find(y=>y.id===t.id);if(!x)return false;
        if(x.status!==pick)logAdd(x,'status',ST[pick]+(pick==='doing'?', ETA '+eta:'')+(pick==='waiting'?': '+who.trim():''));
        x.status=pick;x.eta=pick==='doing'?eta:'';x.waitingOn=pick==='waiting'?who.trim():'';x.waitSince=pick==='waiting'?(t.status==='waiting'&&t.waitSince?t.waitSince:ymd(today())):'';
        x.doneOn=(pick==='done'||pick==='dropped')?ymd(today()):'';
        if(txt.trim()&&(pick==='done'||pick==='dropped'))logAdd(x,'note',(pick==='dropped'?'Dropped: ':'')+txt.trim());
        return l},'status: '+ST[pick])}
      catch(er){toast(er.message)}
    };
  };
  draw();
}

   {k:'track',label:'Track',type:'select',opts:[['',''],...(c.tracks||[]).map(x=>[x.name,tn(x.name)])],val:t?.track||''},
   {k:'due',label:'Due',type:'date',val:t?.due},

   {k:'pri',label:'Priority',type:'select',opts:['P1','P2','P3'],val:t?.pri||'P2'}];

function capPrompt(name,text){
  const c=S.d.config,td=today(),L=[];
  L.push('You are the meeting-capture assistant for Inflekt OS (Inflekt Growth, a 3-partner growth consultancy). Today is '+ymd(td)+' ('+td.toLocaleDateString('en-GB',{weekday:'long'})+').');
  L.push('Meeting: '+(name||'(untitled)')+(CAP.date?' on '+CAP.date:'')+(CAP.lead?'. Related lead/client: '+CAP.lead:'')+(CAP.track?'. Track: '+CAP.track:''));
  L.push('Team: '+(c.team||[]).join(', '));
  L.push('Tracks: '+(c.tracks||[]).map(t=>t.name).join(' | '));
  L.push('Existing leads/clients: '+(leadNames().join(' | ')||'(none)'));
  L.push('');
  L.push('Read the meeting transcript and reply with ONE code block (```text ... ```) and nothing outside it. Inside, exactly these three parts in this order:');
  L.push('===META===\n{"title":"short meeting title","date":"YYYY-MM-DD","lead":"exact name from the existing leads list, or empty","track":"exact track name, or empty"}');
  L.push('===NOTE===\nA clean meeting note in markdown, max ~350 words: "## Summary" (3-5 lines), "## Key points" (bullets: facts, numbers, stakeholders, objections, what they need, commitments), "## Open questions & risks". Do not paste the transcript. Do not use triple backticks inside the note.');
  L.push('===ITEMS===\nA valid JSON array. Each item: {"type":"task|leadupdate|lead","text":"...","owner":"","due":"YYYY-MM-DD or empty","track":"","priority":"P1|P2|P3","note":"ONE short line of context from the meeting","detail":"","lead":"","status":"","waitingOn":""}');
  L.push('Everything actionable is a TASK. There are no separate events, decisions or readings: a meeting, call or deadline that must happen = a task with its date as due; an agreed decision that needs follow-through = a task; something to read = a task. Purely informational decisions go into the note, not the items.\nRules for items:\n- task: text = short imperative headline; note = one line saying why / what was said in the meeting; owner only if explicit or unambiguous (one of the team); if we are waiting on someone outside the team, put their name in waitingOn and keep owner = our team member who follows up.\n- leadupdate: news about an EXISTING lead; lead = exact name from the list; text = one-line milestone to log (what happened); status = Active, Warm, Completed or Dropped only if clearly changed, else empty; detail = next step.\n- lead: a NEW company to approach that is not in the list; text = company; detail = context.\n- Resolve relative dates against today. Never invent anything. Skip chit-chat. Be complete: every action and lead update in the transcript.');
  L.push('');
  return L.join('\n');
}

/** turn Claude's reply into CAP.items / note / meta; every value is checked against the app's own lists */
function capLoad(raw){
  const parts=raw.split(/===(META|NOTE|ITEMS)===/),sec={};
  for(let i=1;i<parts.length;i+=2)sec[parts[i]]=(parts[i+1]||'');
  const clean=s=>String(s||'').replace(/^\s*```[a-z]*\s*$/gm,'').trim();
  let items,meta={};
  const js=sec.ITEMS||raw,a=js.indexOf('['),b=js.lastIndexOf(']');
  if(a<0||b<a)throw new Error('No item list found in that reply');
  try{items=JSON.parse(js.slice(a,b+1))}catch(e){throw new Error('The item list is not valid JSON - ask Claude to resend it')}
  if(sec.META){const x=sec.META.indexOf('{'),y=sec.META.lastIndexOf('}');try{meta=JSON.parse(sec.META.slice(x,y+1))}catch(e){}}
  const c=S.d.config,team=c.team||[],trk=(c.tracks||[]).map(t=>t.name);
  const fixTrack=v=>{if(!v)return '';const n=normName(v);return trk.find(t=>normName(t)===n||normName(tn(t))===n)||''};
  const fixOwner=v=>team.find(t=>normName(t)===normName(v))||'';
  CAP.items=items.filter(i=>i&&String(i.text||i.lead||'').trim()).map(i=>{
    const it={type:['leadupdate','lead'].includes(i.type)?i.type:'task',text:String(i.text||'').trim(),owner:fixOwner(i.owner),due:/^\d{4}-\d{2}-\d{2}$/.test(i.due||'')?i.due:'',track:fixTrack(i.track),
      priority:['P1','P2','P3'].includes(i.priority)?i.priority:'P2',note:String(i.note||'').trim(),detail:String(i.detail||'').trim(),
      lead:(findLead(i.lead)||{}).company||'',status:LST.includes(i.status)?i.status:'',waitingOn:String(i.waitingOn||'').trim(),res:null};
    if(it.type==='task'&&!it.note&&it.detail){it.note=it.detail;it.detail=''}
    if(it.type==='leadupdate'&&!it.lead){it.type='lead';it.text=String(i.lead||i.text||'').trim();it.detail=it.detail||String(i.text||'').trim()}
    return it});
  if(!CAP.items.length)throw new Error('Claude found nothing to capture');
  CAP.note=clean(sec.NOTE);CAP.step=0;
  CAP.meta=meta;if(!CAP.name&&meta.title)CAP.name=String(meta.title);
  if(!CAP.lead&&findLead(meta.lead))CAP.lead=findLead(meta.lead).company;
  if(!CAP.track&&fixTrack(meta.track))CAP.track=fixTrack(meta.track);

function capBack(){if(CAP.back2sum)CAP.step=CAP.items.length;else if(CAP.step>0)CAP.step--;else CAP.items=null;render()}
const fld=(i,k,label,val,kind,opts)=>{const at='data-i="'+i+'" data-k="'+k+'"';
  if(kind==='select')return '<label>'+label+'</label><select '+at+'>'+opts.map(o=>{const a=Array.isArray(o)?o[0]:o,t=Array.isArray(o)?o[1]:o;return '<option value="'+esc(a)+'"'+(a===(val||'')?' selected':'')+'>'+esc(t||'-')+'</option>'}).join('')+'</select>';
  if(kind==='area')return '<label>'+label+'</label><textarea '+at+' style="min-height:64px">'+esc(val||'')+'</textarea>';
  return '<label>'+label+'</label><input '+at+' type="'+(kind||'text')+'" value="'+esc(val||'')+'">'};
function cardFields(it,i){

function renderSummary(m){

   '<div class="card">'+CAP.items.map((it,i)=>'<div data-go="'+i+'" style="display:flex;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);cursor:pointer"><span class="pill" style="background:'+(it.res==='ok'?IT_COL[it.type]:'#8b96a1')+'">'+(IT_TYPES.find(t=>t[0]===it.type)||[0,it.type])[1].split(' ')[0]+'</span><span style="flex:1;'+(it.res==='ok'?'':'text-decoration:line-through;color:var(--mute)')+'">'+esc(it.type==='leadupdate'?it.lead+': '+it.text:it.text)+'</span></div>').join('')+'<p class="mute" style="margin:8px 0 0">Tap an item to change it.</p></div>'+

   (CAP.note?'<label><input type="checkbox" id="sm_n" checked style="width:auto"> Save the summary and key points to Library > Meeting notes</label>':'<p class="mute">Claude sent no note, so only the confirmed items are saved.</p>')+

function noteMd(title,date,lead,track,ok,tasks){
  const by=t=>ok.filter(i=>i.type===t),L=['# '+title,'','_'+date+' · captured by '+S.conn.me+(lead?' · Lead: '+lead:'')+(track?' · Track: '+tn(track):'')+'_',''];
  if(CAP.note)L.push(CAP.note,'');
  if(tasks.length)L.push('## Actions',...tasks.map(t=>'- '+t.title+' ('+(t.waitingOn?'waiting on '+t.waitingOn+', follow-up ':'')+(t.owner||'unassigned')+(t.due?', due '+t.due:'')+')'+((t.log[0]||{}).t?' - '+t.log[0].t:'')),'');
  if(by('leadupdate').length)L.push('## Pipeline updates',...by('leadupdate').map(i=>'- **'+i.lead+'**: '+i.text+(i.status?' (now '+i.status+')':'')+(i.detail?'. Next: '+i.detail:'')),'');
  if(by('lead').length)L.push('## New leads',...by('lead').map(i=>'- '+i.text+(i.detail?' - '+i.detail:'')),'');
  return L.join('\n');
}
let pushing=false;
function pushItems(){
  if(pushing||!CAP.items)return;pushing=true;
  const title=($('#sm_t')?$('#sm_t').value:CAP.name).trim()||'Meeting',lead=$('#sm_l')?$('#sm_l').value:CAP.lead,track=$('#sm_k')?$('#sm_k').value:CAP.track,saveNote=!!CAP.note&&($('#sm_n')?$('#sm_n').checked:true);
  const inboxId=CAP.inboxId,date=CAP.date||ymd(today()),me=S.conn.me,src='Meeting: '+title,ok=CAP.items.filter(i=>i.res==='ok'),driveId=CAP.driveId,td=ymd(today());
  const path='notes/'+date+'_'+slug(title)+'.md';
  const tasks=ok.filter(i=>i.type==='task').map(i=>{const t=mk({title:i.text,owner:i.owner,due:i.due,pri:i.priority,track:i.track||track,source:src});if(!t.owner)t.owner=autoOwner(t);
    if(i.note)t.log.push({at:td,by:me,k:'note',t:i.note});if(i.waitingOn){t.status='waiting';t.waitingOn=i.waitingOn;t.waitSince=td}return t});
  const updates=ok.filter(i=>i.type==='leadupdate'),newLeads=ok.filter(i=>i.type==='lead').map(i=>({id:uid(),company:i.text,status:'Warm',stage:'Lead',firstContact:td,onboarded:'',milestones:mdate(td)+': Added from "'+title+'"'+(i.detail?' - '+i.detail:''),contact:'',owner:i.owner||'',next:i.detail||'',last:td,nextDate:'',retainer:'',prob:''}));
  const entry={id:path,path,title,date,lead:lead||'',track:track||'',by:me,counts:{tasks:tasks.length,updates:updates.length}};
  const md=saveNote||ok.length?noteMd(title,date,lead,track,ok,tasks):'';
  const summary=[tasks.length&&tasks.length+' task'+(tasks.length>1?'s':''),updates.length&&updates.length+' lead update'+(updates.length>1?'s':''),newLeads.length&&newLeads.length+' new lead'+(newLeads.length>1?'s':''),saveNote&&'meeting note'].filter(Boolean).join(', ')||'nothing';
  // leave the review screen immediately, so there is no button left to press twice
  CAP=capNew();S.tab='tasks';S.filter='all';S.view='open';render();
  (async()=>{
    try{
      if(inboxId){let taken=null;
        await mutate('inbox',l=>{const x=l.find(y=>y.id===inboxId);if(!x)return false;if(x.status!=='pending'){taken=x;return false}x.status='done';x.by=me;x.doneAt=td;return l},'inbox: approved '+title);
        if(taken){toast('Already handled by '+(taken.by||'a partner')+' - nothing pushed');return}
        render()}
      if(saveNote)await saveText(path,md,'meeting note: '+title);
      if(saveNote)await optimistic('meetings',l=>l.filter(x=>x.id!==entry.id).concat(entry),'meeting index');
      if(tasks.length)await optimistic('tasks',l=>addOnce(l,tasks),'meeting tasks: '+title);
      if(updates.length||newLeads.length)await optimistic('pipeline',l=>{
        updates.forEach(u=>{const z=l.find(y=>normName(y.company)===normName(u.lead));if(!z)return;
          const line=mdate(date)+': '+u.text;if(!String(z.milestones||'').includes(line))z.milestones=(z.milestones?z.milestones+'\n':'')+line;
          z.last=td;if(u.status)z.status=u.status;if(u.detail)z.next=u.detail});
        return addOnce(l,newLeads)},'pipeline from '+title);
      if(driveId){const rec={id:driveId,name:title,by:me,at:td};await optimistic('imported',l=>l.some(x=>x.id===rec.id)?false:l.concat(rec),'imported '+title)}
      toast('Pushed: '+summary);
    }catch(e){toast(e.message)}
    finally{pushing=false}
  })();
}

       +'</div>'}).join('')||'<p class="mute" style="padding:14px">No leads here yet.</p>')+'</div>';
  $('#pa').onclick=()=>editLead(null);

  m.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{const id=b.closest('[data-id]').dataset.id,x=S.d.pipeline.find(y=>y.id===id);
    if(b.dataset.a==='touch')once(b,async()=>{await mutate('pipeline',l=>{const z=l.find(y=>y.id===id);if(!z)return false;z.last=ymd(today());return l},'touch');render()});
    else if(b.dataset.a==='edit')editLead(x);else claudeModal({title:'Research '+x.company,ai:{tpl:(S.d.config.prompts||[]).find(q=>/research/i.test(q.name))?.name,subject:x.company,context:''},status:'x',id:'none'});});

function editLead(x){
  form(x?'Edit lead':'New lead',[{k:'company',label:'Lead / client',val:x?.company},
   {k:'status',label:'Status',type:'select',opts:LST.map(s=>[s,LHINT[s]]),val:x?leadStatus(x):'Warm'},
   {k:'stage',label:'Detail (e.g. Proposal sent, Mail sent)',val:x?.stage},
   {k:'firstContact',label:'First contact',type:'date',val:x?.firstContact},{k:'onboarded',label:'Onboarded',type:'date',val:x?.onboarded},
   {k:'milestones',label:'Milestones (one per line)',type:'area',val:x?.milestones},{k:'contact',label:'Contact',type:'area',val:x?.contact},
   {k:'owner',label:'Owner',type:'select',opts:['',...S.d.config.team],val:x?.owner||''},{k:'next',label:'Next step',val:x?.next}],
   async o=>{if(!o.company.trim())throw new Error('Name needed');

  if(x){const d=document.createElement('button');d.className='g';d.style.cssText='color:var(--bad);float:right';d.textContent='Delete';let armed=false;

/* ---- back button: one step at a time (dialog > review screen > previous tab > Today); double press on Today exits ---- */
let exitAt=0;
try{history.replaceState({s:0},'');history.pushState({s:1},'')}catch(e){}
window.addEventListener('popstate',()=>{
  const rearm=()=>{try{history.pushState({s:1},'')}catch(e){}};
  if($('#modal').style.display==='flex'){closeModal();return rearm()}
  if(S.tab==='capture'&&CAP.items){capBack();return rearm()}
  if(S.stack.length){S.tab=S.stack.pop();S.popping=true;render();return rearm()}
  if(S.tab!=='today'){S.tab='today';S.popping=true;render();return rearm()}
  const now=Date.now();
  if(now-exitAt<2200){history.back();return}
  exitAt=now;toast('Press back again to exit');rearm();
});
